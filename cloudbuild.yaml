# Run the build as the dedicated forge service account (already has
# storage.admin, cloudsql.client, secretmanager.secretAccessor, editor) rather
# than the broad default compute SA. Requires options.logging below to be set
# to CLOUD_LOGGING_ONLY (a user-specified build SA cannot use the default logs
# bucket).
serviceAccount: 'projects/forge-497716/serviceAccounts/forge-177@forge-497716.iam.gserviceaccount.com'

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gtm-validator:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gtm-validator:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/gtm-validator:$SHORT_SHA'

  # Apply DB migrations against Cloud SQL BEFORE routing traffic to the new
  # revision. exec-wrapper starts the Cloud SQL Auth Proxy for the -s instance
  # (creating the /cloudsql/... socket the app connects through) and runs
  # `migrate` inside the freshly built image. Runs as the Cloud Build SA, which
  # needs roles/cloudsql.client + roles/secretmanager.secretAccessor(DB_PASSWORD).
  # If this step fails the build aborts and the deploy step never runs, so prod
  # is never served against an unmigrated schema.
  - name: 'gcr.io/google-appengine/exec-wrapper'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        /buildstep/execute.sh \
          -i gcr.io/$PROJECT_ID/gtm-validator:$SHORT_SHA \
          -s $PROJECT_ID:us-west1:gtm-db-v2 \
          -e ENVIRONMENT=production \
          -e DB_PASSWORD="$$DB_PASSWORD" \
          -- python manage.py migrate --noinput
    secretEnv: ['DB_PASSWORD']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gtm-validator'
      - '--image=gcr.io/$PROJECT_ID/gtm-validator:$SHORT_SHA'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=forge-177@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:us-west1:gtm-db-v2'
      # SITE_BASE_URL must live on this line, not a flag of its own:
      # --set-env-vars REPLACES the whole plain-env-var set on every deploy. It
      # backs absolute links in emails sent without a request object (the
      # generate_beta_invite_codes command), which otherwise fall back to the
      # raw run.app URL from settings.py.
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production,DEBUG=False,GCS_BUCKET_NAME=forge-497716-gtm-media,SITE_BASE_URL=https://forge.funti3r.xyz'
      # EMAIL_HOST_USER is held as a secret only to keep the address out of this
      # public repo -- it is the Gmail account whose app password is
      # EMAIL_HOST_PASSWORD. BOTH are required for any outbound mail: with
      # EMAIL_HOST_USER empty, Django's SMTP backend skips login() entirely and
      # Gmail rejects the unauthenticated send. EMAIL_HOST_PASSWORD was attached
      # to the service by hand and is listed here so the config is reproducible;
      # --update-secrets merges, so naming an already-attached secret is safe.
      - '--update-secrets=DB_PASSWORD=DB_PASSWORD:latest,DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,EMAIL_HOST_USER=EMAIL_HOST_USER:latest,EMAIL_HOST_PASSWORD=EMAIL_HOST_PASSWORD:latest'
      # 4Gi is required, not optional: the app loads spaCy/sentence-transformers/
      # scikit-learn NLP models for document analysis on top of the gunicorn
      # workers; this OOMs at 2Gi. Do not lower.
      - '--memory=4Gi'
      - '--cpu=2'
      # --no-cpu-throttling is REQUIRED, not a tuning knob: document extraction
      # and all Gemini generation (playbook, diagnostics, audits) run in
      # fire-and-forget daemon threads (gtm/utils_async.py) that keep working
      # after the HTTP response returns. With default CPU throttling Cloud Run
      # starves those threads to ~0 CPU once the response is sent, so results
      # never materialise and the client polls forever. Costs more (CPU billed
      # for full instance lifetime) but the async architecture does not work
      # without it.
      - '--no-cpu-throttling'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--timeout=120'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
      env: 'DB_PASSWORD'

images:
  - 'gcr.io/$PROJECT_ID/gtm-validator:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/gtm-validator:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
