<div id="insight-{{ response.question.id_code }}">
  {% if response.ai_insight %}
    <div class="mt-3 p-3 rounded text-sm shadow-inner overflow-hidden border-l-4
      {% if response.score >= 4 %}bg-green-50 border-green-500
      {% elif response.score == 3 %}bg-yellow-50 border-yellow-400
      {% else %}bg-red-50 border-red-500{% endif %}">
      <div class="flex items-center mb-1">
        <span class="text-lg mr-2" role="img" aria-label="lightbulb">💡</span>
        <span class="font-semibold {% if response.score >= 4 %}text-green-700{% elif response.score == 3 %}text-yellow-700{% else %}text-red-700{% endif %}">
          AI Insight:
        </span>
      </div>
      <p class="text-gray-800 mt-1 leading-snug break-words">{{ response.ai_insight }}</p>
    </div>
  {% elif not response.ai_insight %}
    <div class="mt-3 p-3 bg-gray-50 border-l-4 border-indigo-400 rounded text-sm shadow-inner flex items-center gap-3"
         hx-get="{% url 'gtm:insight_status' session.uuid response.id %}"
         hx-trigger="load, every 3s"
         hx-target="this"
         hx-swap="outerHTML">
      <div class="animate-spin h-4 w-4 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
      <span class="text-gray-600 italic">AI is analyzing this area...</span>
    </div>
  {% endif %}
</div>
