<div class="flex flex-col sm:flex-row flex-wrap gap-2 sm:gap-3"
     id="playbook-btn-loading"
     hx-get="{% url 'gtm:playbook_status' session.uuid %}"
     hx-trigger="every 5s"
     hx-swap="outerHTML">
    <div class="inline-flex items-center justify-center px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl bg-indigo-500 text-white font-bold cursor-wait text-sm sm:text-base whitespace-nowrap">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Preparing Playbook...</span>
    </div>
    <a href="{% url 'gtm:download' session.uuid %}" class="inline-flex items-center justify-center px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl border border-indigo-300 text-white hover:bg-indigo-600 transition text-sm sm:text-base whitespace-nowrap">
        <i class="fas fa-download mr-2"></i>
        <span>Download PDF</span>
    </a>
</div>
<script>
  (function() {
    var MAX_POLLS = 24; // 24 × 5s = 120s max
    var el = document.getElementById("playbook-btn-loading");
    var count = 0;
    if (el) {
      el.addEventListener("htmx:afterRequest", function() {
        count++;
        if (count >= MAX_POLLS) {
          el.removeAttribute("hx-trigger");
          htmx.process(el);
          var span = el.querySelector("span");
          if (span) span.textContent = "Playbook generation timed out. Reload to retry.";
        }
      });
    }
  })();
</script>
