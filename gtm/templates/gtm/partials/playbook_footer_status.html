{% if ready %}
<a href="{% url 'gtm:playbook' session.uuid %}"
   hx-get="{% url 'gtm:playbook' session.uuid %}"
   hx-target="#main-content"
   hx-select="#main-content"
   hx-swap="innerHTML swap:200ms"
   hx-push-url="true"
   class="w-full inline-flex items-center justify-center px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl bg-gray-900 text-white text-sm sm:text-base font-semibold hover:bg-gray-800 transition">
  View Playbook
</a>
{% else %}
<div hx-get="{% url 'gtm:playbook_footer_status' session.uuid %}"
     hx-trigger="every 5s"
     hx-swap="outerHTML"
     class="w-full inline-flex items-center justify-center px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl bg-gray-200 text-gray-500 text-sm sm:text-base font-semibold cursor-wait">
  <svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  Preparing... (status updates above)
</div>
{% endif %}
