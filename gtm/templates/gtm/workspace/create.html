{% extends 'gtm/base.html' %}

{% block title %}Create Workspace{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl border border-indigo-100 p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-900 mb-2">Create Workspace</h1>
            <p class="text-gray-600">Set up a collaborative space for your team</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                    Workspace Name
                </label>
                <input 
                    type="text" 
                    name="name" 
                    id="name" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="e.g., Acme Corp Assessment"
                >
                <p class="text-sm text-gray-500 mt-1">
                    Choose a descriptive name for your workspace
                </p>
            </div>

            <div class="flex gap-4">
                <button 
                    type="submit"
                    class="flex-1 bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 font-medium"
                >
                    Create Workspace
                </button>
                
                <a 
                    href="{% url 'gtm:workspace:list' %}"
                    class="flex-1 bg-gray-100 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-200 font-medium text-center"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
