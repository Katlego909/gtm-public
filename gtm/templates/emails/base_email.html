<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>
  <style>
    @media (max-width: 600px) {
      .container { width: 100% !important; }
      .card-pad { padding: 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:'Inter',Arial,sans-serif;">
  <!-- Preheader (hidden in most clients) -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader|default:brand_name }}</div>

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:40px 0;">
    <tr>
      <td align="center">
        <table class="container" width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
          <!-- Header -->
          <tr>
            <td style="background-color:#B8530F;padding:32px 40px;text-align:center;">
              <a href="{{ brand_url }}" style="text-decoration:none;">
                <span style="color:#ffffff;font-size:24px;font-weight:700;letter-spacing:-0.5px;">{{ brand_name }}</span>
              </a>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td class="card-pad" style="padding:40px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color:#f9fafb;padding:20px 40px;text-align:center;border-top:1px solid #e5e7eb;">
              <p style="margin:0;color:#9ca3af;font-size:12px;">&copy; 2026 {{ brand_name }}. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
