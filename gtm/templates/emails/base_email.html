<!doctype html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>

  <style>
    /* Minimal responsive helpers */
    @media (max-width: 600px) {
      .container { width: 100% !important; padding: 0 16px !important; }
      .card { padding: 16px !important; }
      .btn { display: block !important; width: 100% !important; }
      .stack > * { display: block !important; margin-bottom: 8px !important; }
    }
    /* Dark mode tweaks */
    @media (prefers-color-scheme: dark) {
      body, .bg { background: #0f1115 !important; }
      .card { background: #161a22 !important; color: #eaeaea !important; }
      .muted { color: #9ba3af !important; }
      .divider { border-color: #242938 !important; }
      .btn { background: #2563eb !important; color: #ffffff !important; }
      a { color: #60a5fa !important; }
      .score { color: #ffffff !important; }
      .pill { background: #0b0f1a !important; color: #eaeaea !important; border-color:#1f2937 !important;}
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f6f8fb;" class="bg">
  <!-- Preheader (hidden in most clients) -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    {{ preheader|default:"GTM Assessment Report" }}
  </div>

  <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table class="container" role="presentation" cellspacing="0" cellpadding="0" border="0" width="640" style="width:640px;background:transparent;">
          <!-- Header -->
          <tr>
            <td align="left" style="padding:8px 0 16px;">
              <a href="{{ brand_url }}" style="text-decoration:none;">
                <img src="{{ logo_url }}" alt="{{ brand_name }}" width="140" style="display:block;border:0;outline:none;">
              </a>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td class="card" style="background:#ffffff;border-radius:14px;padding:24px;border:1px solid #eef0f4;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 0 8px;">
              <p class="muted" style="margin:0;font-size:12px;color:#6b7280;">
                You’re receiving this because an assessment was completed in {{ brand_name }}.
              </p>
              <p class="muted" style="margin:8px 0 0;font-size:12px;color:#6b7280;">
                © {{ brand_name }} • <a href="{{ brand_url }}" style="color:#3b82f6;text-decoration:none;">Visit website</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
