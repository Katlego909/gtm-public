{% extends "dashboard/base.html" %}

{% block content %}
<div class="p-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Confirm Deletion</h1>
        <p class="mb-6 text-gray-600">Are you sure you want to delete the metric: <strong class="text-gray-900">{{ instance.metric }}</strong>? This action cannot be undone.</p>
        
        <form method="post" hx-disable>
            {% csrf_token %}
            <div class="flex items-center gap-4">
                <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                    Confirm Delete
                </button>
                <a href="{% url 'dashboard' %}" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
