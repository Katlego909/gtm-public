{% extends "dashboard/base.html" %}

{% block content %}
<div class="p-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <form hx-post="{{ request.path }}" hx-target="#main-content" hx-swap="innerHTML" class="bg-white p-6 rounded-lg shadow-md">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-6 flex items-center gap-4">
            <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Save</button>
            <a href="{% url 'dashboard' %}" hx-get="{% url 'dashboard' %}" hx-target="#main-content" hx-push-url="true" class="text-sm text-gray-600 hover:underline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
