{% with instance_id=instance_id|default:"default" %}
<div class="relative js-dropdown-trigger" id="global-search-{{ instance_id }}"
     data-panel="global-search-panel-{{ instance_id }}">
    <div class="relative">
        <input type="search" name="q" placeholder="Search..." autocomplete="off"
               id="global-search-input-{{ instance_id }}"
               onfocus="showDropdownPanel('global-search-panel-{{ instance_id }}')"
               hx-get="{% url 'global_search' %}"
               hx-trigger="keyup changed delay:300ms, focus"
               hx-target="#global-search-panel-content-{{ instance_id }}"
               hx-swap="innerHTML"
               class="pl-10 pr-4 py-2 w-64 text-sm bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
    </div>
    <div id="global-search-panel-{{ instance_id }}"
         class="hidden absolute left-0 mt-2 w-80 bg-white border border-gray-200 rounded-lg z-50">
        <div id="global-search-panel-content-{{ instance_id }}">
            <p class="px-4 py-6 text-xs text-gray-500 text-center">Keep typing to search…</p>
        </div>
    </div>
</div>
{% endwith %}
