{% for ref in refs %}
<div class="mb-2">
    <a href="/dashboard/documents/{{ ref.id }}/export/pdf/{{ scope_qs }}" target="_blank"
       class="inline-flex items-center gap-2 px-2 py-1 bg-indigo-50 text-indigo-700 text-xs rounded-md hover:bg-indigo-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        {{ ref.action|capfirst }}: {{ ref.title }} ({{ ref.doc_type_display }}, v{{ ref.version }})
    </a>
</div>
{% endfor %}
