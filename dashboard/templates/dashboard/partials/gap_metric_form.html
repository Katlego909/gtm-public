<div class="p-8">
    <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
    <form hx-post="{{ request.path }}" 
          hx-target="#gap-analysis-table" 
          hx-swap="outerHTML"
          class="bg-white p-6 rounded-lg shadow-md">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-6 flex items-center gap-4">
            <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">Save</button>
            <button type="button" onclick="closeModal()" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">Cancel</button>
        </div>
    </form>
</div>
