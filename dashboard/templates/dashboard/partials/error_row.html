<tr id="gap-metric-{{ pk }}">
    <td colspan="8" class="px-4 py-3 bg-red-50 border-t border-b border-red-200">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
                </svg>
                <span class="text-sm font-medium text-red-700">{{ message }}</span>
            </div>
            {% if restore_url %}
            <button type="button"
                    hx-get="{{ restore_url }}"
                    hx-target="#gap-metric-{{ pk }}"
                    hx-swap="outerHTML"
                    class="px-4 py-1.5 text-sm bg-white text-gray-700 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                Dismiss
            </button>
            {% endif %}
        </div>
    </td>
</tr>
