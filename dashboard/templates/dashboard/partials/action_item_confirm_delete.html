<div class="p-8">
    <div class="flex justify-center mb-4">
        <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </div>
    </div>
    <h2 class="text-xl font-bold mb-2 text-center text-red-600">Delete Action Item</h2>
    <p class="mb-2 text-gray-600 text-center">Are you sure you want to delete this action item?</p>
    <div class="bg-gray-50 rounded-lg p-3 mb-4 border-l-4 border-red-400">
        <p class="text-gray-700 font-medium mb-0">{{ instance.note }}</p>
        {% if instance.assigned_to %}
        <p class="text-gray-500 text-sm mt-1 mb-0">Assigned to: {{ instance.assigned_to.get_full_name|default:instance.assigned_to.username }}</p>
        {% endif %}
    </div>
    <p class="text-sm text-gray-400 text-center mb-6">This action cannot be undone.</p>
    
    <form hx-post="{{ request.path }}"
          hx-target="#action-items-container"
          hx-swap="outerHTML"
          method="POST">
        {% csrf_token %}
        <div class="flex items-center justify-center gap-4">
            <button type="button" onclick="closeModal()" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">Cancel</button>
            <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">Delete</button>
        </div>
    </form>
</div>
