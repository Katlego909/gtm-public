{% if success %}
<div class="p-6 text-center">
    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h3 class="text-lg font-bold text-gray-900 mb-2">Workspace Created!</h3>
    <p class="text-gray-600 mb-6">Your new workspace has been created. The page will refresh to load it.</p>
    <button type="button"
            class="w-full bg-indigo-600 text-white px-4 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition"
            onclick="closeHubModal(); window.location.reload();">
        Done
    </button>
</div>
{% else %}
<div class="p-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Create Workspace</h3>
        <button type="button" class="text-gray-400 hover:text-gray-600" onclick="closeHubModal()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <form hx-post="{% url 'create_workspace_dashboard' %}"
          hx-target="#hub-modal-content"
          hx-swap="innerHTML"
          data-hx-sustain="true"
          class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Workspace Name</label>
            <input type="text"
                   name="name"
                   required
                   placeholder="e.g., Acme Corp Assessment"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        {% if error %}
        <div class="text-red-600 text-sm">{{ error }}</div>
        {% endif %}
        <div class="flex gap-3">
            <button type="submit"
                    class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                Create Workspace
            </button>
            <button type="button" class="flex-1 bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200" onclick="closeHubModal()">
                Cancel
            </button>
        </div>
    </form>
</div>
{% endif %}
