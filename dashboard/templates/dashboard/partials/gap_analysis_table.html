<div id="gap-analysis-table" class="overflow-x-auto mt-4">
    <table class="min-w-full text-left border-collapse">
        <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-semibold">
            <tr>
                <th class="px-4 py-3 whitespace-nowrap">Category</th>
                <th class="px-4 py-3 whitespace-nowrap">Metric</th>
                <th class="px-4 py-3 whitespace-nowrap">Current</th>
                <th class="px-4 py-3 whitespace-nowrap">Target</th>
                <th class="px-4 py-3 whitespace-nowrap">Gap</th>
                <th class="px-4 py-3 whitespace-nowrap">Priority</th>
                <th class="px-4 py-3 whitespace-nowrap">Recommendation</th>
                <th class="px-4 py-3 whitespace-nowrap text-center">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 text-sm" 
               id="gap-analysis-table-body"
               hx-get="{% url 'refresh_gap_analysis_table' %}"
             hx-include="#workspace-selector"
               hx-trigger="gapAnalysisUpdated from:body"
               hx-swap="innerHTML">
            {% for gap in gap_analysis %}
                {% include "dashboard/partials/_gap_analysis_row.html" with gap=gap %}
            {% empty %}
            <tr><td colspan="8" class="px-4 py-10 text-center text-gray-400 italic">No gap analysis data found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
