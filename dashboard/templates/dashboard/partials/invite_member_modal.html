{% if success %}
<div class="p-6 text-center">
    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h3 class="text-lg font-bold text-gray-900 mb-2">Invitation Sent!</h3>
    <p class="text-gray-600 mb-6">The invitation has been sent successfully.</p>
    <div class="flex flex-col sm:flex-row gap-3">
        <button type="button"
                hx-get="{% url 'invite_to_workspace' workspace.id %}"
                hx-target="#hub-modal-content"
                hx-swap="innerHTML"
                class="flex-1 bg-indigo-600 text-white px-4 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
            Send Another
        </button>
        <button type="button"
                onclick="closeHubModal()"
                class="flex-1 bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg font-medium hover:bg-gray-200 transition">
            Done
        </button>
    </div>
</div>
{% else %}
<div class="p-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Invite Team Member</h3>
        <button type="button" class="text-gray-400 hover:text-gray-600" onclick="closeHubModal()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <form hx-post="{% url 'invite_to_workspace' workspace.id %}"
          hx-target="#hub-modal-content"
          hx-swap="innerHTML"
          data-hx-sustain="true"
          class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email"
                   name="email"
                   required
                   placeholder="colleague@company.com"
                   value="{{ email|default:'' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select name="role"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                <option value="contributor" {% if role == 'contributor' %}selected{% endif %}>Contributor</option>
                <option value="manager" {% if role == 'manager' %}selected{% endif %}>Manager</option>
                <option value="admin" {% if role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        {% if error %}
        <div class="text-red-600 text-sm">{{ error }}</div>
        {% endif %}
        <div class="flex gap-3">
            <button type="submit"
                    class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                Send Invitation
            </button>
            <button type="button" class="flex-1 bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200" onclick="closeHubModal()">
                Cancel
            </button>
        </div>
    </form>
</div>
{% endif %}
