{% if success %}
<div class="p-6 text-center">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Invitation Sent!</h3>
        <p class="mb-4">The invitation was sent successfully.</p>
        <button type="button" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700" onclick="closeModal(); window.location.reload();">OK</button>
</div>
{% else %}
<div class="p-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Invite Team Member</h3>
        <button type="button" class="text-gray-400 hover:text-gray-600" onclick="closeModal()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <form hx-post="{% url 'invite_to_workspace' workspace.id %}"
          hx-target="#modal-content"
          hx-swap="outerHTML"
          class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                 <input type="email"
                     name="email"
                     required
                     placeholder="colleague@company.com"
                     value="{{ email|default:'' }}"
                     class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select name="role"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                <option value="contributor" {% if role == 'contributor' %}selected{% endif %}>Contributor</option>
                <option value="manager" {% if role == 'manager' %}selected{% endif %}>Manager</option>
                <option value="admin" {% if role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        {% if error %}
        <div class="text-red-600 text-sm">{{ error }}</div>
        {% endif %}
        <div class="flex gap-3">
            <button type="submit"
                    class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                Send Invitation
            </button>
            <button type="button" class="flex-1 bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200" onclick="closeModal()">
                Cancel
            </button>
        </div>
    </form>
</div>
{% endif %}
