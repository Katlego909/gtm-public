<div class="p-6">
    <h2 class="text-2xl font-bold text-red-600 mb-2">Delete Resource</h2>
    <p class="text-gray-600 mb-6">Are you sure you want to delete <strong>{{ instance.name }}</strong>? This action cannot be undone.</p>
    
    <form hx-post="{% url 'delete_resource' instance.id %}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="flex justify-end gap-3">
        {% csrf_token %}
        <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">Cancel</button>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-red-600 border border-transparent rounded-md hover:bg-red-700 shadow-sm">Delete Forever</button>
    </form>
</div>
